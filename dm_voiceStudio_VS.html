<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <title>Voice Separator · Voice Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0f172a;
      --surface: #334155;
      --border: #3f4d63;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, #1e293b, transparent 70%),
        var(--bg-1);
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: rgba(30, 41, 59, .72);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      backdrop-filter: blur(10px);
    }
    .crumbs {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      align-items: center;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .crumbs a { color: var(--muted); text-decoration: none; transition: color .15s; }
    .crumbs a:hover { color: var(--accent); }
    .crumbs .current { color: var(--text); }

    h1 { margin: 0 0 .3rem; font-size: 1.45rem; letter-spacing: -.02em; }
    .subtitle { margin: 0 0 1.5rem; font-size: .88rem; color: var(--muted); }

    .placeholder {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      text-align: center;
      background: rgba(51, 65, 85, .4);
    }
    .placeholder .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: .75rem;
    }
    .placeholder h2 {
      margin: 0 0 .5rem;
      font-size: 1.05rem;
    }
    .placeholder p {
      margin: 0 auto;
      max-width: 44ch;
      font-size: .88rem;
      line-height: 1.6;
      color: var(--muted);
    }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: .88rem;
      color: var(--accent);
      text-decoration: none;
    }
    .back:hover { color: #7dd3fc; }
  </style>
</head>
<body>
  <main class="app">
    <nav class="crumbs">
      <a href="index.html">Documents Manager</a>
      <span>/</span>
      <a href="dm_voiceStudio.html">Voice Studio</a>
      <span>/</span>
      <span class="current">Voice Separator</span>
    </nav>

    <h1>Voice Separator</h1>
    <p class="subtitle">Isolate vocals from a track.</p>

    <div class="placeholder">
      <span class="icon">✂️</span>
      <h2>Coming soon</h2>
      <p>
        This module will take an audio file and split it into separate
        vocal and instrumental tracks, so speech can be extracted from
        background music or noise.
      </p>
      <a class="back" href="dm_voiceStudio.html">← Back to Voice Studio</a>
    </div>
  </main>
</body>
</html>
