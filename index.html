<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free Text → MP3</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 150px; padding: .5rem; font-size: 1rem; }
    select, button { padding: .6rem 1rem; margin: .5rem .5rem .5rem 0; font-size: 1rem; cursor: pointer; }
    audio { display: block; margin-top: 1rem; width: 100%; }
    #status { color: #555; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Free Text → Speech → MP3</h1>

  <textarea id="text">For the Buccaneers. I want something Free. Uh and uh as it was.</textarea>

  <div>
    <select id="voice">
      <option value="Brian">Brian (US Male)</option>
      <option value="Amy">Amy (US Female)</option>
      <option value="Emma">Emma (UK Female)</option>
      <option value="Joanna">Joanna (US Female)</option>
      <option value="Matthew">Matthew (US Male)</option>
      <option value="Salli">Salli (US Female)</option>
    </select>

    <button id="playBtn">Play</button>
    <button id="downloadBtn">Download MP3</button>
  </div>

  <audio id="player" controls></audio>
  <div id="status"></div>

  <script>
    const textEl = document.getElementById('text');
    const voiceEl = document.getElementById('voice');
    const player = document.getElementById('player');
    const statusEl = document.getElementById('status');

    function apiUrl() {
      const text = encodeURIComponent(textEl.value.trim());
      const voice = encodeURIComponent(voiceEl.value);
      return `/api/tts?voice=${voice}&text=${text}`;
    }

    document.getElementById('playBtn').onclick = () => {
      if (!textEl.value.trim()) return;
      player.src = apiUrl();
      player.play();
    };

    document.getElementById('downloadBtn').onclick = async () => {
      if (!textEl.value.trim()) return;
      statusEl.textContent = 'Generating MP3…';
      try {
        const res = await fetch(apiUrl());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'speech.mp3';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = 'Downloaded ✅';
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
    };
  </script>
</body>
</html>
